project_id = "uniclub"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
port = 54322
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "io.supabase.uniclub://login-callback"
additional_redirect_urls = ["io.supabase.uniclub://**", "http://localhost:3000/**"]
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[storage]
enabled = true
file_size_limit = "50MiB"

[realtime]
enabled = true

[functions.send-push]
verify_jwt = false

[functions.dispatch-notifications]
verify_jwt = false

[functions.payment-webhook]
verify_jwt = false
